# Lint rules for CI. Kept small on purpose: real mistakes (unused or undefined names, bug-prone patterns),
# not style opinions such as line length. Run locally with:  ruff check .
target-version = "py310"
extend-exclude = ["venv", ".venv", "data"]

[lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # line length is a style opinion
    "B008",  # Depends(...) in defaults is how FastAPI works
    "B905",  # zip(strict=) where lengths are equal by construction
]
