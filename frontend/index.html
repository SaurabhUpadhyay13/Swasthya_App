<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareFlow Hospital Operations</title>
  <meta name="description" content="OPD queue and medicine stock tracking for hospital teams.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230F8E96'/%3E%3Cpath d='M9 5h6v4h4v6h-4v4H9v-4H5V9h4z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/doctor.css">
  <link rel="stylesheet" href="/css/accounts.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard" aria-label="CareFlow home">
        <span class="brand-mark" id="brand-mark"></span>
        <span class="brand-text"><strong>CareFlow</strong><small>OPD and pharmacy</small></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/dashboard" data-route="dashboard"><span data-icon="grid"></span><span>Overview</span></a>
        <a href="#/queue" data-route="queue"><span data-icon="users"></span><span>OPD queue</span></a>
        <a href="#/track" data-route="track"><span data-icon="search"></span><span>Track a token</span></a>
        <a href="#/stock" data-route="stock"><span data-icon="package"></span><span>Medicine stock</span></a>
        <a href="#/doctor" data-route="doctor"><span data-icon="pulse"></span><span>Doctor desk</span></a>
        <a href="#/staff" data-route="staff"><span data-icon="shield"></span><span>OPD staff desk</span></a>
        <a href="#/patient" data-route="patient"><span data-icon="heart"></span><span>Patient portal</span></a>
      </nav>
      <a class="docs-link" href="/docs" target="_blank" rel="noopener">API documentation</a>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Overview</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="topbar-right">
          <span class="live-pill"><i></i>Live</span>
          <time id="clock" class="clock"></time>
        </div>
      </header>
      <div id="view"></div>
    </main>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
