name: CI

# Runs on every push to main and on every pull request, so a broken change is caught before it is merged.
# It also runs every Monday, because the dependencies in requirements.txt are not pinned: a new release of
# FastAPI, Pydantic or Starlette can break the app even when nobody touched the code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Cheap checks first: catches typos, unused or undefined names, broken imports, bad menu links and committed secrets.
  lint:
    name: Lint and wiring checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Python lint (ruff)
        run: ruff check .

      - name: Frontend wiring (syntax, imports, menu links, routes)
        run: python scripts/check_frontend.py

      - name: No secrets or database files committed
        run: |
          problems=0
          if git ls-files | grep -E '(^|/)\.env$|\.db$|\.sqlite3?$|(^|/)data/'; then
            echo "::error::A .env file, a database or the data/ folder is tracked by git. Remove it and keep it in .gitignore."
            problems=1
          fi
          if git grep -nE 'nvapi-[A-Za-z0-9_-]{20,}' -- . ':!.github'; then
            echo "::error::Something that looks like an NVIDIA API key is in the code. Keys belong in .env only."
            problems=1
          fi
          exit $problems

  # 2. The test suite on the Python you run (3.10) and the newest one, on Linux and on Windows (where you develop).
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false      # one failing combination must not hide the others
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # 3. The real app, started for real, driven over HTTP the way the browser drives it.
  smoke:
    name: Smoke test (running server)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt

      - name: Start the server with demo data
        env:
          DATA_DIR: ${{ runner.temp }}/careflow-data
          SEED_DEMO_DATA: "true"
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "::error::The server did not start within 30 seconds"
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Walk through the main journeys
        run: python scripts/smoke.py http://127.0.0.1:8000

      - name: Server log (only when something failed)
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  # 4. Known vulnerabilities in the libraries. Informational: a new advisory is not your code's fault,
  #    so this shows a warning but never blocks a merge.
  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  # One check to rule them all: make THIS the required check in the branch protection rule.
  ci-passed:
    name: CI passed
    needs: [lint, test, smoke]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every required job succeeded
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} smoke=${{ needs.smoke.result }}"
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.smoke.result }}" = "success" ]